<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CloudBox</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="h-full flex items-center justify-center bg-slate-50 p-4 antialiased">

    <div class="w-full max-w-md bg-white rounded-3xl border border-slate-200/90 shadow-xl p-8 space-y-6">
        <!-- Logo Header -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 mx-auto">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight font-heading text-slate-900">Welcome Back</h1>
            <p class="text-xs text-slate-500">Sign in to your CloudBox account to manage your files</p>
        </div>

        <!-- Alert Banner -->
        <div id="errorAlert" class="hidden p-3 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium"></div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition" placeholder="name@company.com">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition" placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
                Sign In
            </button>
        </form>

        <div class="text-center text-xs text-slate-500">
            Don't have an account? 
            <a href="register.html" class="font-bold text-indigo-600 hover:underline">Sign up for free</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await Auth.redirectIfAuthenticated();

            // Allow pressing Enter key on any input to submit form
            const form = document.getElementById('loginForm');
            const inputs = form.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        form.requestSubmit();
                    }
                });
            });
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertEl = document.getElementById('errorAlert');
            const btn = document.getElementById('submitBtn');

            if (!email || !password) return;

            alertEl.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Signing In...';

            try {
                await Auth.signIn(email, password);
                window.location.href = 'index.html';
            } catch (err) {
                alertEl.textContent = err.message || 'Invalid login credentials';
                alertEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
    <!-- Developer Credit Badge -->
    <div class="fixed bottom-4 left-4 z-50">
        <div class="px-3 py-1.5 rounded-full bg-slate-900/80 backdrop-blur-md text-white text-[11px] font-medium border border-slate-700/50 shadow-lg flex items-center gap-1.5 opacity-90 hover:opacity-100 transition">
            <span class="text-indigo-400">Made by</span>
            <span class="font-semibold text-slate-200">Discord: notarato</span>
        </div>
    </div>
</body>
</html>

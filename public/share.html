<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared File - CloudBox</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="h-full flex items-center justify-center bg-slate-50 p-4 antialiased">

    <!-- Loading Container -->
    <div id="loadingState" class="text-center space-y-3">
        <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-xs text-slate-500 font-medium">Retrieving shared file details...</p>
    </div>

    <!-- Error State Container (Expired / Invalid Link) -->
    <div id="errorState" class="hidden max-w-md w-full bg-white rounded-3xl border border-slate-200/90 shadow-xl p-8 text-center space-y-4">
        <div class="w-14 h-14 rounded-2xl bg-rose-50 border border-rose-100 text-rose-600 flex items-center justify-center mx-auto">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        <h2 id="errorTitle" class="text-xl font-extrabold font-heading text-slate-900">Share Link Expired</h2>
        <p id="errorMessage" class="text-xs text-slate-500">This file link has expired or is no longer available.</p>
        <a href="index.html" class="inline-block px-5 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition">Go to CloudBox</a>
    </div>

    <!-- Active File Share Container -->
    <div id="fileState" class="hidden max-w-md w-full bg-white rounded-3xl border border-slate-200/90 shadow-2xl p-8 space-y-6 text-center">
        <!-- Logo Badge -->
        <div class="flex items-center justify-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z"></path>
                </svg>
            </div>
            <span class="text-lg font-extrabold font-heading text-slate-900">CloudBox Shared File</span>
        </div>

        <!-- File Card Info -->
        <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200/80 space-y-4">
            <div class="w-16 h-16 rounded-2xl bg-indigo-100/70 border border-indigo-200/80 text-indigo-600 flex items-center justify-center mx-auto shadow-inner">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
            </div>

            <div class="space-y-1">
                <h3 id="fileName" class="text-base font-bold font-heading text-slate-900 truncate">Filename.ext</h3>
                <p id="fileOriginalName" class="text-xs font-mono text-slate-400 truncate">original_name.ext</p>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-200/60 text-left text-xs">
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">File Size</span>
                    <span id="fileSize" class="font-mono font-bold text-slate-700">0 MB</span>
                </div>
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Upload Date</span>
                    <span id="fileDate" class="font-medium text-slate-700">Aug 22, 2026</span>
                </div>
            </div>
        </div>

        <!-- Expiration Notice -->
        <div class="flex items-center justify-center gap-1.5 text-[11px] font-medium text-amber-600 bg-amber-50 py-2 px-3 rounded-xl border border-amber-200">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span id="expirationBadge">Link expires soon</span>
        </div>

        <!-- Bottom Middle Download Button -->
        <div class="pt-2 flex justify-center">
            <button id="downloadBtn" onclick="triggerDownload()" class="w-full max-w-xs py-3.5 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                Download File
            </button>
        </div>
    </div>

    <script>
        let currentShareData = null;

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                showError('Invalid Link', 'No share token provided in the URL.');
                return;
            }

            try {
                // Fetch Share record
                const { data: share, error: shareErr } = await window.supabaseClient
                    .from('file_shares')
                    .select('*, files(*)')
                    .eq('share_token', token)
                    .single();

                if (shareErr || !share || !share.files) {
                    showError('Link Expired or Invalid', 'This shared file link is no longer available.');
                    return;
                }

                // Check Expiration Date
                const now = new Date();
                const expiresAt = new Date(share.expires_at);

                if (now > expiresAt) {
                    showError('Link Expired', `This share link expired on ${expiresAt.toLocaleDateString()} at ${expiresAt.toLocaleTimeString()}.`);
                    return;
                }

                currentShareData = share;

                // Populate File Details
                const file = share.files;
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('fileOriginalName').textContent = file.original_name;
                document.getElementById('fileSize').textContent = formatBytes(file.size);
                document.getElementById('fileDate').textContent = new Date(file.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                // Calculate Remaining Time
                const diffHours = Math.round((expiresAt - now) / (1000 * 60 * 60));
                const diffDays = Math.ceil(diffHours / 24);
                document.getElementById('expirationBadge').textContent = `Link expires in ${diffHours > 24 ? diffDays + ' day(s)' : diffHours + ' hour(s)'}`;

                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('fileState').classList.remove('hidden');

            } catch (err) {
                showError('Error', err.message || 'Failed to load file details.');
            }
        });

        function showError(title, message) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('fileState').classList.add('hidden');
            document.getElementById('errorTitle').textContent = title;
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorState').classList.remove('hidden');
        }

        async function triggerDownload() {
            if (!currentShareData || !currentShareData.files) return;
            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            btn.textContent = 'Preparing Download...';

            const file = currentShareData.files;

            try {
                // Try generating signed URL or direct download link
                const { data, error } = await window.supabaseClient.storage
                    .from('cloudbox')
                    .createSignedUrl(file.storage_path, 300);

                if (!error && data?.signedUrl) {
                    const a = document.createElement('a');
                    a.href = data.signedUrl;
                    a.download = file.original_name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                } else {
                    alert(`Downloading ${file.original_name}...`);
                }
            } catch (e) {
                alert('Download Error: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Download File`;
            }
        }
    </script>
</body>
</html>

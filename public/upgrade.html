<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Plan - CloudBox</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="h-full flex items-center justify-center bg-slate-50 p-6 antialiased">

    <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200 shadow-xl p-8 space-y-6 text-center">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 mx-auto text-white">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>

        <h2 class="text-2xl font-extrabold font-heading text-slate-900">Upgrade to CloudBox Premium</h2>
        <p class="text-xs text-slate-500">Expand your storage limit from 1 GB to 5 GB and upload files up to 100 MB each.</p>

        <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100 text-left space-y-3">
            <div class="text-2xl font-extrabold font-heading text-indigo-950">$4.99 <span class="text-xs font-normal text-indigo-600">/ month</span></div>
            <ul class="text-xs text-slate-600 space-y-2">
                <li class="flex items-center gap-2">✓ 5 GB Total Storage Space</li>
                <li class="flex items-center gap-2">✓ 100 MB Max File Upload Size</li>
                <li class="flex items-center gap-2">✓ Priority Direct Download Speed</li>
            </ul>
        </div>

        <button id="upgradeBtn" onclick="handleUpgrade()" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-600/20 transition">
            Upgrade Now
        </button>

        <a href="index.html" class="block text-xs font-semibold text-slate-400 hover:text-slate-600 transition">Back to Storage</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await Auth.requireAuth();
        });

        async function handleUpgrade() {
            const btn = document.getElementById('upgradeBtn');
            btn.disabled = true;
            btn.textContent = 'Upgrading...';

            try {
                await Auth.upgradeToPremium();
                alert('Congratulations! Your account has been upgraded to CloudBox Premium (5 GB storage).');
                window.location.href = 'index.html';
            } catch (err) {
                alert('Upgrade failed: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Upgrade Now';
            }
        }
    </script>
</body>
</html>
